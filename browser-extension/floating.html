<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知己跨站试穿</title><link rel="stylesheet" href="floating.css"></head>
<body>
  <main>
    <div class="drop-zone"><strong>把网页中的衣服图片拖到这里</strong><p>或者 <label class="file-label">选择图片<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label></p></div>
    <div id="garment" hidden><img id="photo" alt="选中的商品图片"><label>单品名称<input id="name" maxlength="100"></label><label>单品类别<select id="category"><option>上装</option><option>下装</option><option>外套</option><option>连体装</option></select></label></div>
    <p id="consent">开始后会读取选中的商品图片，并将图片和摄像头画面发送给 Anywear / Decart。<a href="https://docs.platform.decart.ai/resources/privacy-policy" target="_blank" rel="noopener noreferrer">隐私政策</a></p>
    <button id="start" disabled>同意并开始试穿</button>
    <p id="status" role="status" aria-live="polite">先拖入一张清晰的衣服图片</p>
    <div id="preview"></div>
    <p id="error" role="alert" hidden></p>
    <button id="like" disabled>♡ 喜欢，保存到项目</button>
    <button id="favorites" class="secondary">查看我的喜欢穿搭</button>
    <p class="note">试穿仅供款式与配色参考。收藏保存商品图片和链接；额度及排队以服务方提示为准。收藏时请保留已连接的项目标签页。</p>
  </main><script type="module" src="floating.js"></script>
</body></html>
