name: fashion-recommendation

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashion_recommendation}
      POSTGRES_USER: ${POSTGRES_USER:-fashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion_2404}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fashion_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fashion_2404}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fashion_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fashion_2404}
      MINIO_BUCKET: ${MINIO_BUCKET:-garments-private}
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET"
    restart: "no"

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    environment:
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8090},http://127.0.0.1:${FRONTEND_PORT:-8090},http://localhost:8088,http://127.0.0.1:8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fashion_recommendation}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fashion}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fashion_2404}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fashion_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fashion_2404}
      MINIO_BUCKET: ${MINIO_BUCKET:-garments-private}
      MINIO_MAX_FILE_SIZE: ${MINIO_MAX_FILE_SIZE:-10485760}
      MINIO_CLEANUP_INTERVAL: ${MINIO_CLEANUP_INTERVAL:-60s}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      # Local loopback HTTP only; HTTPS deployments must override this to true.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      BAILIAN_ENABLED: ${BAILIAN_ENABLED:-true}
      BAILIAN_VISION_ENABLED: ${BAILIAN_VISION_ENABLED:-false}
      BAILIAN_VISION_MODEL: ${BAILIAN_VISION_MODEL:-qwen-vl-plus}
      BAILIAN_ENDPOINT: ${BAILIAN_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      BAILIAN_CONNECT_TIMEOUT: ${BAILIAN_CONNECT_TIMEOUT:-3s}
      BAILIAN_READ_TIMEOUT: ${BAILIAN_READ_TIMEOUT:-8s}
      BAILIAN_IMAGE_ENABLED: ${BAILIAN_IMAGE_ENABLED:-true}
      BAILIAN_IMAGE_MODEL: ${BAILIAN_IMAGE_MODEL:-wan2.6-image}
      BAILIAN_IMAGE_ENDPOINT: ${BAILIAN_IMAGE_ENDPOINT:-https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
      BAILIAN_IMAGE_TASK_ENDPOINT: ${BAILIAN_IMAGE_TASK_ENDPOINT:-https://dashscope.aliyuncs.com/api/v1/tasks}
      BAILIAN_IMAGE_PROTOTYPE_MALE: ${BAILIAN_IMAGE_PROTOTYPE_MALE:-classpath:reference_photo/model-male.png}
      BAILIAN_IMAGE_PROTOTYPE_FEMALE: ${BAILIAN_IMAGE_PROTOTYPE_FEMALE:-classpath:reference_photo/model-female.png}
      BAILIAN_IMAGE_REFERENCE_BASE_URL: ${BAILIAN_IMAGE_REFERENCE_BASE_URL:-}
      BAILIAN_IMAGE_CONNECT_TIMEOUT: ${BAILIAN_IMAGE_CONNECT_TIMEOUT:-5s}
      BAILIAN_IMAGE_READ_TIMEOUT: ${BAILIAN_IMAGE_READ_TIMEOUT:-15s}
      BAILIAN_IMAGE_TASK_TIMEOUT: ${BAILIAN_IMAGE_TASK_TIMEOUT:-90s}
      BAILIAN_IMAGE_POLL_INTERVAL: ${BAILIAN_IMAGE_POLL_INTERVAL:-2s}
      TREND_JSON_URL: ${TREND_JSON_URL:-}
      TREND_EDITORIAL_ENABLED: ${TREND_EDITORIAL_ENABLED:-true}
      TREND_IMPORT_DIRECTORY: /app/trend-data
      TREND_DOUYIN_URL: ${TREND_DOUYIN_URL:-}
      TREND_XIAOHONGSHU_URL: ${TREND_XIAOHONGSHU_URL:-}
      TREND_WEIBO_URL: ${TREND_WEIBO_URL:-}
      TREND_REFRESH_INTERVAL: ${TREND_REFRESH_INTERVAL:-21600000}
      TREND_PLATFORM: ${TREND_PLATFORM:-configured-feed}
      TREND_WEB_URLS: ${TREND_WEB_URLS:-}
      TREND_WEB_PLATFORM: ${TREND_WEB_PLATFORM:-web-scrape}
      TREND_WEB_MAX_PAGE_CHARS: ${TREND_WEB_MAX_PAGE_CHARS:-1000000}
      TREND_WEB_MAX_ARTICLES_PER_PAGE: ${TREND_WEB_MAX_ARTICLES_PER_PAGE:-10}
      TREND_CONNECT_TIMEOUT: ${TREND_CONNECT_TIMEOUT:-3s}
      TREND_READ_TIMEOUT: ${TREND_READ_TIMEOUT:-5s}
      TREND_CACHE_TTL: ${TREND_CACHE_TTL:-15m}
      TREND_AI_REVIEW_ENABLED: ${TREND_AI_REVIEW_ENABLED:-true}
      TREND_AI_REVIEW_MODEL: ${TREND_AI_REVIEW_MODEL:-qwen-plus}
      TREND_AI_REVIEW_CONNECT_TIMEOUT: ${TREND_AI_REVIEW_CONNECT_TIMEOUT:-3s}
      TREND_AI_REVIEW_READ_TIMEOUT: ${TREND_AI_REVIEW_READ_TIMEOUT:-8s}
      TREND_AI_REVIEW_INITIAL_DELAY: ${TREND_AI_REVIEW_INITIAL_DELAY:-30000}
      TREND_AI_REVIEW_INTERVAL: ${TREND_AI_REVIEW_INTERVAL:-300000}
      TREND_AI_REVIEW_BATCH_SIZE: ${TREND_AI_REVIEW_BATCH_SIZE:-10}
      WEATHER_PRIMARY_BASE_URL: ${WEATHER_PRIMARY_BASE_URL:-https://wttr.in}
      WEATHER_FALLBACK_GEOCODING_BASE_URL: ${WEATHER_FALLBACK_GEOCODING_BASE_URL:-https://geocoding-api.open-meteo.com}
      WEATHER_FALLBACK_FORECAST_BASE_URL: ${WEATHER_FALLBACK_FORECAST_BASE_URL:-https://api.open-meteo.com}
      WEATHER_CONNECT_TIMEOUT: ${WEATHER_CONNECT_TIMEOUT:-3s}
      WEATHER_READ_TIMEOUT: ${WEATHER_READ_TIMEOUT:-3s}
      WEATHER_CACHE_TTL: ${WEATHER_CACHE_TTL:-15m}
      WEATHER_CACHE_MAX_SIZE: ${WEATHER_CACHE_MAX_SIZE:-500}
      WEATHER_CONFIGURED_DEMO_ENABLED: ${WEATHER_CONFIGURED_DEMO_ENABLED:-false}
      WEATHER_CONFIGURED_CITY: ${WEATHER_CONFIGURED_CITY:-}
      WEATHER_CONFIGURED_TEMPERATURE_C: ${WEATHER_CONFIGURED_TEMPERATURE_C:-}
      WEATHER_CONFIGURED_APPARENT_TEMPERATURE_C: ${WEATHER_CONFIGURED_APPARENT_TEMPERATURE_C:-}
      WEATHER_CONFIGURED_PRECIPITATION_MM: ${WEATHER_CONFIGURED_PRECIPITATION_MM:-}
      WEATHER_CONFIGURED_WEATHER_CODE: ${WEATHER_CONFIGURED_WEATHER_CODE:-}
      WEATHER_CONFIGURED_WIND_SPEED_KMH: ${WEATHER_CONFIGURED_WIND_SPEED_KMH:-}
    volumes:
      - ./tools/trend-collector/data:/app/trend-data:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
