server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # The production canonical hostname; keep this aligned with PUBLIC_ORIGIN.
    location / {
        return 308 https://www.jaime.ltd$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Start with a short policy while verifying the first HTTPS rollout.
    set $cloud_hsts "max-age=300";

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cloud_tls:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/cloud/locations.conf;
}
