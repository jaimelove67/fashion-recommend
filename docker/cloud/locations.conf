# This file is included inside the HTTP or direct-TLS server block.
# Keep the upload and AI response budgets consistent at the browser entry point.
client_max_body_size 11m;
add_header X-Content-Type-Options nosniff always;
# Empty on HTTP. HSTS is emitted only for a connection terminated here as TLS.
add_header Strict-Transport-Security $cloud_hsts always;

gzip on;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Fixed public CDN only. No arbitrary URL, credentials or query forwarding.
location ~ ^/trend-images/(?<trend_host>wx[1-4])/(?<trend_size>cmw960|large|mw690|thumbnail|orj360|thumb150)/(?<trend_file>[A-Za-z0-9]+\.(?:jpg|jpeg|png|webp))$ {
    resolver 127.0.0.11 ipv6=off valid=300s;
    proxy_pass https://$trend_host.sinaimg.cn/$trend_size/$trend_file;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host $trend_host.sinaimg.cn;
    proxy_set_header User-Agent "fashion-trend-images/1.0";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Sec-Fetch-Dest "";
    proxy_set_header Sec-Fetch-Mode "";
    proxy_set_header Sec-Fetch-Site "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}

location /api/ {
    proxy_connect_timeout 5s;
    proxy_send_timeout 150s;
    proxy_read_timeout 150s;
    proxy_pass http://backend:8080/api/;
    # Preserve a nonstandard host port used by an SSH-tunnel browser session.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Never accept a client-supplied scheme, host, forwarding chain or prefix.
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
}

# Revalidate the SPA entry point after each deployment.
location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security $cloud_hsts always;
    try_files /index.html =404;
}

location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security $cloud_hsts always;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
