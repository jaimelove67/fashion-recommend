server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        # Secure by default for deployed environments. Local HTTP Compose runs
        # explicitly set SESSION_COOKIE_SECURE=false in .env.example.
        secure: ${SESSION_COOKIE_SECURE:true}

spring:
  application:
    name: fashion-recommendation-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fashion_recommendation}
    username: ${SPRING_DATASOURCE_USERNAME:fashion}
    password: ${SPRING_DATASOURCE_PASSWORD:fashion_2404}
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    registration-enabled: ${AUTH_REGISTRATION_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8088,http://127.0.0.1:8088}
  bailian:
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${BAILIAN_MODEL:qwen-plus}
    # Recommendation LLM is opt-in. Default off so automated tests / E2E never make paid calls even
    # when a key is present; set BAILIAN_ENABLED=true explicitly for production/demo model use.
    enabled: ${BAILIAN_ENABLED:false}
    vision-enabled: ${BAILIAN_VISION_ENABLED:false}
    vision-model: ${BAILIAN_VISION_MODEL:qwen-vl-plus}
    endpoint: ${BAILIAN_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    connect-timeout: ${BAILIAN_CONNECT_TIMEOUT:3s}
    read-timeout: ${BAILIAN_READ_TIMEOUT:8s}
  trends:
    endpoint: ${TREND_JSON_URL:}
    platform: ${TREND_PLATFORM:configured-feed}
    connect-timeout: ${TREND_CONNECT_TIMEOUT:3s}
    read-timeout: ${TREND_READ_TIMEOUT:5s}
    cache-ttl: ${TREND_CACHE_TTL:15m}
  weather:
    primary-base-url: ${WEATHER_PRIMARY_BASE_URL:${WEATHER_BASE_URL:https://wttr.in}}
    fallback-geocoding-base-url: ${WEATHER_FALLBACK_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
    fallback-forecast-base-url: ${WEATHER_FALLBACK_FORECAST_BASE_URL:https://api.open-meteo.com}
    connect-timeout: ${WEATHER_CONNECT_TIMEOUT:3s}
    read-timeout: ${WEATHER_READ_TIMEOUT:3s}
    cache-ttl: ${WEATHER_CACHE_TTL:15m}
    cache-max-size: ${WEATHER_CACHE_MAX_SIZE:500}
    # Offline presentation fallback: default off. Only when both real providers fail AND the
    # requested city matches configured-city does it return a static snapshot (source=configured-demo).
    # It is never real-time weather; enable only in .env for a defense/presentation run.
    configured-demo-enabled: ${WEATHER_CONFIGURED_DEMO_ENABLED:false}
    configured-city: ${WEATHER_CONFIGURED_CITY:}
    configured-temperature-c: ${WEATHER_CONFIGURED_TEMPERATURE_C:}
    configured-apparent-temperature-c: ${WEATHER_CONFIGURED_APPARENT_TEMPERATURE_C:}
    configured-precipitation-mm: ${WEATHER_CONFIGURED_PRECIPITATION_MM:}
    configured-weather-code: ${WEATHER_CONFIGURED_WEATHER_CODE:}
    configured-wind-speed-kmh: ${WEATHER_CONFIGURED_WIND_SPEED_KMH:}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:fashion_minio_admin}
    secret-key: ${MINIO_ROOT_PASSWORD:fashion_2404}
    bucket: ${MINIO_BUCKET:garments-private}
    max-file-size: ${MINIO_MAX_FILE_SIZE:10485760}
    cleanup-interval: ${MINIO_CLEANUP_INTERVAL:60s}
