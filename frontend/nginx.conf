server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fixed public CDN only. No arbitrary URL, credentials or query forwarding.
    location ~ ^/trend-images/(?<trend_host>wx[1-4])/(?<trend_size>cmw960|large|mw690|thumbnail)/(?<trend_file>[A-Za-z0-9]+\.(?:jpg|jpeg|png|webp))$ {
        resolver 127.0.0.11 ipv6=off valid=300s;
        proxy_pass https://$trend_host.sinaimg.cn/$trend_size/$trend_file;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $trend_host.sinaimg.cn;
        proxy_set_header User-Agent "fashion-trend-images/1.0";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Sec-Fetch-Dest "";
        proxy_set_header Sec-Fetch-Mode "";
        proxy_set_header Sec-Fetch-Site "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        # A 10 MiB photo plus multipart headers and garment fields.
        client_max_body_size 11m;
        # Daily image generation can wait up to 120s for the provider response.
        proxy_read_timeout 150s;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA entry point must be revalidated so a deployment cannot keep an old asset manifest.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
