# Optional direct TLS termination in the existing frontend container.
# Requires Docker Compose 2.24.4+ for !override. Apply after the cloud overlay.
# PUBLIC_ORIGIN=https://your-domain (include a port when using a nonstandard one)
# TLS_CERT_DIR is an absolute host directory containing fullchain.pem/privkey.pem.
# Default binding is still loopback. A public listener requires explicitly setting
# FRONTEND_TLS_BIND_IP=0.0.0.0 and FRONTEND_TLS_PORT=443 after deployment approval.
services:
  backend:
    environment:
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set the exact HTTPS public origin before enabling TLS}
      SESSION_COOKIE_SECURE: "true"

  frontend:
    ports: !override
      - "${FRONTEND_TLS_BIND_IP:-127.0.0.1}:${FRONTEND_TLS_PORT:-8443}:443"
    volumes:
      - ./docker/cloud/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set the absolute directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
