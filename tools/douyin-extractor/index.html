<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>抖音素材提取</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#e8eaf2;background:#10121a;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:65px auto;padding:0 24px}header{display:flex;align-items:center;gap:13px;margin-bottom:40px}.mark{width:44px;height:44px;border-radius:14px;background:#cae88d;color:#171c10;display:grid;place-items:center;font-size:24px;font-weight:800}.brand{font-weight:650}.sub{font-size:12px;color:#9399ae;margin-top:4px}h1{font-size:38px;letter-spacing:-1px;margin:0 0 14px}p{color:#a1a7ba;line-height:1.8;margin:0 0 24px}.panel{background:#191d29;border:1px solid #303546;border-radius:20px;padding:27px}label{display:block;margin-bottom:12px;font-size:14px;font-weight:600}textarea{resize:vertical;width:100%;min-height:124px;border:1px solid #42495c;border-radius:12px;background:#11151f;color:#f4f5f9;padding:16px;font:inherit;line-height:1.6;outline:none}textarea:focus{border-color:#cae88d;box-shadow:0 0 0 3px #cae88d15}.actions{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:18px}button,.file{font:inherit;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;font-size:14px;text-decoration:none}button:disabled{opacity:.5;cursor:wait}.primary{background:#cae88d;color:#1a2310;font-weight:700}.secondary{background:#282e3e;color:#c4cada}.hint{font-size:12px;color:#8e96ad;line-height:1.7}.bar{display:flex;justify-content:space-between;align-items:center;margin:36px 0 15px}.bar h2{font-size:17px;margin:0}.empty{padding:40px 15px;border:1px dashed #343b4c;border-radius:16px;text-align:center;color:#858da4;font-size:14px}.job{border:1px solid #343b4c;border-radius:16px;padding:21px;margin-bottom:14px;background:#171b25}.top{display:flex;justify-content:space-between;gap:12px}.title{font-size:15px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}.badge{font-size:12px;color:#cae88d;white-space:nowrap}.message{font-size:13px;line-height:1.8;color:#a9b1c5;margin-top:12px;overflow-wrap:anywhere}.error .badge{color:#ffaaa8}.partial .badge{color:#f1d58a}.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.file{background:#272e3f;color:#dbe5ff;padding:8px 12px;font-size:12px}.cancel{padding:5px 10px;margin-top:12px}.foot{margin-top:25px;font-size:12px;color:#8089a0;line-height:1.9;overflow-wrap:anywhere}#error{color:#ffb3ad;margin-top:14px;font-size:13px;line-height:1.7}a{color:#cae88d}button:focus-visible,a:focus-visible{outline:2px solid #cae88d;outline-offset:4px}@media(max-width:600px){main{margin:30px auto;padding:0 16px}h1{font-size:29px}.panel{padding:18px}.actions{align-items:stretch;flex-direction:column}.bar{gap:10px}.top{flex-direction:column}}
</style>
<main>
<header><div class="mark">↓</div><div><div class="brand">抖音素材提取</div><div class="sub">本地工具 · 视频 / 图集</div></div></header>
<h1>把喜欢的画面，保存下来。</h1>
<p>粘贴抖音分享内容，提取视频或整组图片，保存到你的电脑。</p>
<form class="panel" id="form"><label for="share">作品分享链接</label><textarea id="share" maxlength="12000" required placeholder="在抖音中点击「分享 → 复制链接」，然后粘贴到这里。&#10;支持整段分享文案、视频链接和图文链接。"></textarea><div class="actions"><span class="hint">提取时会打开独立浏览器。<br>如有登录或验证提示，请在该浏览器中完成。</span><button class="primary" id="submit">提取并保存 ↗</button></div><div id="error" role="alert"></div></form>
<div class="bar"><h2>提取记录</h2><button class="secondary" id="folder">打开保存文件夹</button></div>
<div id="jobs" aria-live="polite"><div class="empty">还没有提取任务，粘贴一条链接开始。</div></div>
<div class="foot">文件保存位置：<span id="output">downloads/</span><br>仅处理你有权保存的作品。登录状态仅保存在本机；程序不会要求粘贴 Cookie。<br>记录显示本次运行的任务；已下载文件会一直保留。实况图暂保存静态图片，不提取伴随动效。</div>
</main>
<script>
const token='__LOCAL_TOKEN__';
const labels={queued:'排队中',opening:'打开浏览器',extracting:'读取作品',downloading:'下载中',done:'已完成',partial:'部分完成',error:'未完成',cancelled:'已取消'};
const active=new Set(['queued','opening','extracting','downloading']);
const $=id=>document.getElementById(id);
async function api(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:{'X-Local-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw Error(data.error||'请求失败');return data;}
function element(tag,className,text){const el=document.createElement(tag);el.className=className;if(text!==undefined)el.textContent=text;return el;}
let last='';
async function refresh(){try{const data=await api('/api/jobs');$('output').textContent=data.output;const serialized=JSON.stringify(data.jobs);if(serialized===last)return;last=serialized;const fragment=document.createDocumentFragment();if(!data.jobs.length)fragment.append(element('div','empty','还没有提取任务，粘贴一条链接开始。'));for(const job of data.jobs){const card=element('article','job '+job.state),top=element('div','top');top.append(element('div','title',job.title||job.url),element('span','badge',labels[job.state]||job.state));card.append(top,element('div','message',job.message));if(job.files.length){const files=element('div','files');for(const file of job.files){const link=element('a','file',file.name+' · '+(file.size/1048576).toFixed(2)+' MB');link.href='/files/'+job.id+'/'+encodeURIComponent(file.name);link.download=file.name;files.append(link)}if(['done','partial'].includes(job.state)){const meta=element('a','file','作品信息 JSON');meta.href='/files/'+job.id+'/metadata.json';meta.download='metadata.json';files.append(meta)}card.append(files)}if(active.has(job.state)){const cancel=element('button','secondary cancel',job.cancel?'取消中…':'取消任务');cancel.disabled=!!job.cancel;cancel.onclick=async()=>{try{await api('/api/cancel',{id:job.id});await refresh()}catch(e){$('error').textContent=e.message}};card.append(cancel)}fragment.append(card)}$('jobs').replaceChildren(fragment)}catch(e){$('error').textContent='连接本地程序失败，请确认启动窗口仍在运行。'}}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('error').textContent='';try{await api('/api/jobs',{text:$('share').value});await refresh()}catch(e){$('error').textContent=e.message}finally{$('submit').disabled=false}};
$('folder').onclick=async()=>{try{await api('/api/open-folder',{})}catch(e){$('error').textContent=e.message}};
async function poll(){await refresh();setTimeout(poll,1200)}poll();
</script>
</html>
